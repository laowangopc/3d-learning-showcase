name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SHOWCASE_RUNTIME_ROOT: ${{ runner.temp }}/3d-learning-showcase
      - run: node --test scripts/catalog.test.mjs scripts/model-topic.test.mjs scripts/interaction.test.mjs
